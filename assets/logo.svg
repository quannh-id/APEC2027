<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 110" width="380" height="110" fill="none">
  <defs>
    <linearGradient id="sunGrad" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#FF7A00"/>
      <stop offset="60%" stop-color="#FFB800"/>
      <stop offset="100%" stop-color="#FFE600"/>
    </linearGradient>
    <linearGradient id="blueGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A3FF"/>
      <stop offset="100%" stop-color="#0047BA"/>
    </linearGradient>
    <linearGradient id="blueGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="70%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="deepBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#072b61"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- LOGO ICON EMBLEM -->
  <g transform="translate(10, 5)" filter="url(#subtleGlow)">
    <!-- Sun -->
    <circle cx="58" cy="38" r="19" fill="url(#sunGrad)" />
    <!-- Rising mountain / wave crest silhouette in sun -->
    <path d="M 50 48 L 57 37 L 62 43 L 69 34 L 77 48 Z" fill="#0284C7" opacity="0.85" />
    
    <!-- Sweeping outer crescent (cyan-blue) -->
    <path d="M 50 6 C 75 6 95 24 95 50 C 95 72 78 92 52 95 C 40 96 28 92 20 84 C 36 90 54 88 68 76 C 82 64 84 44 76 28 C 70 16 60 10 50 6 Z" fill="url(#blueGrad1)" />
    
    <!-- Central dynamic ocean wave flow -->
    <path d="M 22 56 C 26 40 40 24 58 20 C 42 26 34 38 34 50 C 34 66 48 76 64 76 C 76 76 86 70 90 62 C 84 76 70 86 52 86 C 34 86 22 74 22 56 Z" fill="url(#blueGrad2)" />
    
    <!-- Base ocean swirl -->
    <path d="M 32 68 C 42 78 58 80 72 74 C 82 70 88 60 92 50 C 88 64 76 74 62 76 C 48 78 38 74 32 68 Z" fill="url(#deepBlueGrad)" />
    
    <!-- Red and Yellow Energy Swooshes on lower left -->
    <!-- Yellow Swoosh -->
    <path d="M 20 44 C 18 52 19 60 23 68 C 21 60 21 52 23 46 C 24 43 25 41 26 39 C 24 40 22 42 20 44 Z" fill="#FFB800" />
    <path d="M 23 52 C 22 62 26 72 34 80 C 28 72 26 62 27 54 Z" fill="#F97316" />
    <!-- Red Swoosh -->
    <path d="M 18 58 C 17 66 21 76 29 84 C 23 76 21 68 22 60 Z" fill="#DC2626" />
  </g>

  <!-- LOGO TYPOGRAPHY -->
  <g transform="translate(118, 0)">
    <!-- APEC -->
    <text x="0" y="38" font-family="'Montserrat', 'Inter', 'Segoe UI', sans-serif" font-size="34" font-weight="900" letter-spacing="2.5" fill="#0B3066">APEC</text>
    
    <!-- VIET NAM -->
    <text x="0" y="69" font-family="'Montserrat', 'Inter', 'Segoe UI', sans-serif" font-size="29" font-weight="800" letter-spacing="2" fill="#DA251D">VIET NAM</text>
    
    <!-- 2027 with decorative line -->
    <g transform="translate(0, 88)">
      <line x1="0" y1="-5" x2="24" y2="-5" stroke="#0284C7" stroke-width="2" stroke-linecap="round" />
      <text x="36" y="0" font-family="'Montserrat', 'Inter', 'Segoe UI', sans-serif" font-size="20" font-weight="700" letter-spacing="4" fill="#0B3066">2027</text>
      <line x1="102" y1="-5" x2="126" y2="-5" stroke="#0284C7" stroke-width="2" stroke-linecap="round" />
    </g>
    
    <!-- PHÚ QUỐC -->
    <text x="0" y="104" font-family="'Montserrat', 'Inter', 'Segoe UI', sans-serif" font-size="12" font-weight="700" letter-spacing="6" fill="#1E40AF">PHÚ QUỐC</text>
  </g>
</svg>
